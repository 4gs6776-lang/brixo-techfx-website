<style>
  :root {
    /* Made background significantly darker (pure black) */
    --bg-primary: #000000;
    --bg-secondary: #020203;
    --bg-tertiary: #040608;
    --text-primary: #F8FAFC;
    --text-muted: #94A3B8;
    --text-dim: #64748B;
    --accent-blue: #0066FF;
    --accent-cyan: #00E5FF;
    --border-color: rgba(255, 255, 255, 0.06);
    --glass-bg: rgba(2, 4, 8, 0.45);
  }

  [data-theme="light"] {
    --bg-primary: #FAFBFC;
    --bg-secondary: #F0F4F8;
    --bg-tertiary: #E1E8F0;
    --text-primary: #050B16;
    --text-muted: #475569;
    --text-dim: #94A3B8;
    --accent-blue: #0052E0;
    --accent-cyan: #0090B8;
    --border-color: rgba(5, 11, 22, 0.08);
    --glass-bg: rgba(255, 255, 255, 0.65);
  }

  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Manrope', sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    overflow-x: hidden;
    transition: background-color 0.4s ease, color 0.4s ease;
    position: relative; /* Required for the vector background */
  }

  /* PREMIUM VECTOR LINES BACKGROUND PATTERN */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -1;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%230066FF' stroke-width='1' stroke-opacity='0.04'%3E%3Cpath d='M40 0 L40 80 M0 40 L80 40'/%3E%3Cpath d='M20 20 L20 60 M60 20 L60 60' stroke='%2300E5FF' stroke-opacity='0.03'/%3E%3Cpath d='M10 30 L30 30 L30 10 M50 70 L70 70 L70 50' stroke='%2300E5FF' stroke-opacity='0.05'/%3E%3Ccircle cx='30' cy='10' r='2' fill='%2300E5FF' fill-opacity='0.1'/%3E%3Ccircle cx='70' cy='50' r='2' fill='%2300E5FF' fill-opacity='0.1'/%3E%3C/g%3E%3C/svg%3E");
    background-repeat: repeat;
  }
  [data-theme="light"] body::after {
    background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%230052E0' stroke-width='1' stroke-opacity='0.05'%3E%3Cpath d='M40 0 L40 80 M0 40 L80 40'/%3E%3Cpath d='M20 20 L20 60 M60 20 L60 60' stroke='%230090B8' stroke-opacity='0.04'/%3E%3Cpath d='M10 30 L30 30 L30 10 M50 70 L70 70 L70 50' stroke='%230090B8' stroke-opacity='0.06'/%3E%3Ccircle cx='30' cy='10' r='2' fill='%230090B8' fill-opacity='0.1'/%3E%3Ccircle cx='70' cy='50' r='2' fill='%230090B8' fill-opacity='0.1'/%3E%3C/g%3E%3C/svg%3E");
  }

  ::selection { background: var(--accent-cyan); color: #000; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 10px; }

  .display-font { font-family: 'Sora', sans-serif; letter-spacing: -0.04em; }
  .serif-italic { font-family: 'Instrument Serif', serif; font-style: italic; letter-spacing: -0.02em; font-weight: 400; }
  
  .grad-text {
    background: linear-gradient(120deg, #FFFFFF 0%, #B8D4FF 40%, var(--accent-cyan) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .grad-blue {
    background: linear-gradient(120deg, var(--accent-blue) 0%, var(--accent-cyan) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .grid-bg {
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  [data-theme="light"] .grid-bg {
    background-image:
      linear-gradient(rgba(5, 11, 22, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(5, 11, 22, 0.03) 1px, transparent 1px);
  }

  /* Premium Glassmorphism */
  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--border-color);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.8), inset 0 1px 1px 0 rgba(255,255,255,0.05);
  }

  /* Custom Cursor */
  .cursor-dot, .cursor-ring {
    position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
    border-radius: 50%; transform: translate(-50%, -50%);
    mix-blend-mode: difference;
  }
  .cursor-dot { width: 4px; height: 4px; background: #fff; transition: width 0.2s, height 0.2s, opacity 0.2s; }
  .cursor-ring {
    width: 40px; height: 40px; border: 1px solid rgba(255, 255, 255, 0.3);
    transition: transform 0.15s ease-out, width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), height 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, border-color 0.3s;
  }
  .cursor-hover .cursor-dot { opacity: 0; }
  .cursor-hover .cursor-ring { width: 60px; height: 60px; background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.6); }
  @media (hover: none), (max-width: 768px) {
    .cursor-dot, .cursor-ring { display: none !important; }
  }
  @media (min-width: 769px) {
    body { cursor: none; }
    a, button, input, textarea, select, label, [data-cursor] { cursor: none; }
  }

  /* Magnetic Buttons */
  .btn-primary {
    position: relative; overflow: hidden;
    background: var(--accent-blue); color: #fff;
    padding: 14px 28px; border-radius: 2px;
    font-weight: 600; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, color 0.3s;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.1) inset, 0 20px 40px -10px rgba(0, 102, 255, 0.4);
  }
  .btn-primary::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
    transform: translateX(-100%); transition: transform 0.6s;
  }
  .btn-primary:hover { transform: translateY(-2px); background: var(--accent-cyan); color: #000; box-shadow: 0 0 0 1px rgba(255,255,255,0.2) inset, 0 20px 40px -10px rgba(0, 229, 255, 0.4); }
  .btn-primary:hover::after { transform: translateX(100%); }

  .btn-ghost {
    position: relative; padding: 14px 28px; border-radius: 2px;
    font-weight: 600; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-primary); border: 1px solid var(--border-color);
    transition: all 0.3s ease; overflow: hidden;
  }
  .btn-ghost:hover { border-color: var(--accent-cyan); background: rgba(0, 229, 255, 0.05); }

  .reveal { opacity: 0; transform: translateY(40px); transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1); }
  .reveal.in { opacity: 1; transform: translateY(0); }
  .reveal-stagger > * { opacity: 0; transform: translateY(30px); transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
  .reveal-stagger.in > * { opacity: 1; transform: translateY(0); }
  .reveal-stagger.in > *:nth-child(1) { transition-delay: 0.05s; }
  .reveal-stagger.in > *:nth-child(2) { transition-delay: 0.15s; }
  .reveal-stagger.in > *:nth-child(3) { transition-delay: 0.25s; }
  .reveal-stagger.in > *:nth-child(4) { transition-delay: 0.35s; }
  .reveal-stagger.in > *:nth-child(5) { transition-delay: 0.45s; }
  .reveal-stagger.in > *:nth-child(6) { transition-delay: 0.55s; }

  .hero-stage { perspective: 1200px; }
  .hero-panel { transform-style: preserve-3d; will-change: transform; animation: floatPanel 8s ease-in-out infinite; }
  .hero-panel.delay-1 { animation-delay: -2s; }
  .hero-panel.delay-2 { animation-delay: -4s; }
  .hero-panel.delay-3 { animation-delay: -1s; }
  @keyframes floatPanel {
    0%, 100% { transform: translateY(0) translateZ(0); }
    50% { transform: translateY(-16px) translateZ(20px); }
  }

  /* Bento Box Service Cards */
  .bento-card {
    position: relative; overflow: hidden;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s;
  }
  .bento-card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(0,102,255,0.15), transparent 40%);
    opacity: 0; transition: opacity 0.4s; pointer-events: none;
  }
  .bento-card:hover::before { opacity: 1; }
  .bento-card:hover { transform: translateY(-4px); border-color: rgba(0, 229, 255, 0.3); }
  
  .mask-reveal { overflow: hidden; }
  .mask-reveal > * { display: inline-block; transform: translateY(100%); transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1); }
  .in .mask-reveal > * { transform: translateY(0); }

  .mobile-menu { transform: translateY(-100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
  .mobile-menu.open { transform: translateY(0); }
  .mobile-menu .menu-item { opacity: 0; transform: translateY(20px); transition: opacity 0.5s, transform 0.5s; }
  .mobile-menu.open .menu-item { opacity: 1; transform: translateY(0); }
  .mobile-menu.open .menu-item:nth-child(1) { transition-delay: 0.1s; }
  .mobile-menu.open .menu-item:nth-child(2) { transition-delay: 0.15s; }
  .mobile-menu.open .menu-item:nth-child(3) { transition-delay: 0.2s; }
  .mobile-menu.open .menu-item:nth-child(4) { transition-delay: 0.25s; }
  .mobile-menu.open .menu-item:nth-child(5) { transition-delay: 0.3s; }
  .mobile-menu.open .menu-item:nth-child(6) { transition-delay: 0.35s; }
  .mobile-menu.open .menu-item:nth-child(7) { transition-delay: 0.4s; }

  /* Input Fields */
  .input-group { position: relative; }
  .input-field {
    width: 100%; background: transparent; border: none;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-primary); padding: 20px 0 8px 0;
    font-size: 15px; transition: all 0.3s; font-family: inherit;
  }
  .input-field:focus { outline: none; border-bottom-color: var(--accent-cyan); }
  .input-label {
    position: absolute; top: 20px; left: 0; font-size: 13px;
    color: var(--text-dim); pointer-events: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); text-transform: uppercase; letter-spacing: 0.05em;
  }
  .input-field:focus ~ .input-label,
  .input-field:valid ~ .input-label {
    top: 0; font-size: 10px; color: var(--accent-cyan);
  }
  select.input-field { color: var(--text-primary); }
  select.input-field:invalid { color: var(--text-dim); }

  .timeline-line { background: linear-gradient(180deg, var(--accent-blue) 0%, var(--accent-cyan) 100%); }
  *:focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 3px; border-radius: 4px; }
  
  .toast { transform: translateY(100px); opacity: 0; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s; }
  .toast.show { transform: translateY(0); opacity: 1; }

  .aurora { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.3; pointer-events: none; }

  [data-theme="light"] .text-white { color: #050B16 !important; }
  [data-theme="light"] .text-white\/90 { color: rgba(5, 11, 22, 0.9) !important; }
  [data-theme="light"] .text-white\/80 { color: rgba(5, 11, 22, 0.8) !important; }
  [data-theme="light"] .text-white\/70 { color: rgba(5, 11, 22, 0.7) !important; }
  [data-theme="light"] .text-white\/60 { color: rgba(5, 11, 22, 0.6) !important; }
  [data-theme="light"] .text-white\/55 { color: rgba(5, 11, 22, 0.55) !important; }
  [data-theme="light"] .text-white\/50 { color: rgba(5, 11, 22, 0.5) !important; }
  [data-theme="light"] .text-white\/40 { color: rgba(5, 11, 22, 0.4) !important; }
  [data-theme="light"] .text-white\/30 { color: rgba(5, 11, 22, 0.3) !important; }
  [data-theme="light"] .text-white\/20 { color: rgba(5, 11, 22, 0.2) !important; }
  [data-theme="light"] .text-white\/10 { color: rgba(5, 11, 22, 0.1) !important; }
  [data-theme="light"] .text-white\/5 { color: rgba(5, 11, 22, 0.05) !important; }
</style>
</head>

<body class="font-sans antialiased">
